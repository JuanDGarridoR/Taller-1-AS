spring:
  application:
    name: transferencias-distribuidas

  # Configuración Banco Nacional (PostgreSQL)
  datasource-nacional:
    jdbc-url: jdbc:postgresql://${DB_NACIONAL_HOST:localhost}:${DB_NACIONAL_PORT:5432}/banco_nacional
    username: admin_nacional
    password: nacional123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    
  # Configuración Banco Internacional (MySQL)
  datasource-internacional:
    jdbc-url: jdbc:mysql://${DB_INTERNACIONAL_HOST:localhost}:${DB_INTERNACIONAL_PORT:3306}/banco_internacional?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: admin_internacional
    password: internacional123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    # IMPORTANTE: Cambiado a 'update' para que cree las tablas 'cuenta' al iniciar
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dialectos explícitos para evitar confusiones entre MySQL y Postgres
        dialect: 
          nacional: org.hibernate.dialect.PostgreSQLDialect
          internacional: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    com.universidad.transferencias_distribuidas: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    # Para ver los valores que se guardan en los logs
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Perfil Docker (Solo se activa si corres el JAR dentro de Docker)
---
spring:
  config:
    activate:
      on-profile: docker
  # En Docker, los hosts deben ser los nombres de los servicios del compose
  datasource-nacional:
    jdbc-url: jdbc:postgresql://db-nacional:5432/banco_nacional
  datasource-internacional:
    jdbc-url: jdbc:mysql://db-internacional:3306/banco_internacional?useSSL=false
  jpa:
    show-sql: false